name: spec

on:
  push:
    branches: [main]
    paths:
      - "spec/**"
      - "protocol/**"
      - "scripts/check-spec-change.sh"
      - "scripts/test-spec-change.sh"
      - "Makefile"
      - ".github/workflows/spec.yml"
  pull_request:
    paths:
      - "spec/**"
      - "protocol/**"
      - "scripts/check-spec-change.sh"
      - "scripts/test-spec-change.sh"
      - "Makefile"
      - ".github/workflows/spec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: protocol contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run protocol conformance and guard tests
        run: make spec

      - name: Select the event comparison base
        if: github.event_name != 'workflow_dispatch'
        id: comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          printf 'base=%s\n' "$base" >>"$GITHUB_OUTPUT"

      - name: Require a protocol changelog entry
        if: github.event_name != 'workflow_dispatch'
        env:
          SPEC_BASE: ${{ steps.comparison.outputs.base }}
        run: ./scripts/check-spec-change.sh "$SPEC_BASE" "$GITHUB_SHA"
