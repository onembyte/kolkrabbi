name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows is advisory until migration step 13 (docs/plan/02-architecture.md §12)
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: build (CGO_ENABLED=0 — the cgo rule, §1)
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/...

      # scripts/test.sh, not `go test ./...`: a nested module's tests are
      # invisible to a bare ./..., which prints ok and exits 0.
      - name: test (every module)
        run: make test

  guardrails:
    name: guard rails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # Named gates, so a failure says which rule broke rather than "tests failed".
      - name: architecture (layering, dependencies, naming)
        run: make arch

      - name: purity (the engine touches no OS)
        run: make purity

      - name: build tags (no silently-wrong build)
        run: make buildtags

      - name: platform compile matrix (CGO disabled)
        run: make platforms

      - name: static landing page
        run: make site

      - name: chat, code, and agent surface
        run: make surface

      - name: offline installer safety matrix
        run: make installer

      - name: language-neutral protocol contract
        run: make spec

      - name: release artifact contract
        run: make release-check

      - name: tag-only release workflow contract
        run: make release-workflow-check

      - name: signed public release verifier contract
        run: make release-verifier-check

      - name: weekly live smoke workflow contract
        run: make smoke-workflow-check

      - name: the plan's tick marks match its documents
        run: make plan-check

      - name: every action is pinned by commit SHA
        run: make workflow-pin-check

      # `go install <module>/cmd/x@version` hard-fails on a module with a
      # replace directive, which is exactly how kolk is meant to be installed.
      - name: no replace in the root go.mod
        run: |
          if grep -qE '^replace' go.mod; then
            echo "::error::go.mod has a replace directive; go install @latest refuses it"; exit 1
          fi

      - name: go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          [ -f go.sum ] && cp go.sum go.sum.bak || true
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null; then
            echo "::error::go.mod is not tidy — run go mod tidy"; diff go.mod.bak go.mod || true; exit 1
          fi
          mv go.mod.bak go.mod
          [ -f go.sum.bak ] && mv go.sum.bak go.sum || true

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

  budgets:
    name: budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # Binary size, cold start, the test-count floor and the dependency count.
      # These fail, never warn (docs/plan/02-architecture.md §11).
      - name: budgets
        run: make budgets
