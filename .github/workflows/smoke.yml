name: smoke

# The only workflow that spends real provider quota. It runs once a week and on
# demand — never on a push — against the free model the offline fallback
# catalogue promises, so a week of drift in OpenRouter's API surface shows up
# here rather than in someone's first session.
#
# Opt-in: with no OPENROUTER_API_KEY secret configured the run reports a notice
# and succeeds. A fork that copies this file cannot run it at all.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  live:
    name: live smoke (free model)
    if: github.repository == 'onembyte/kolkrabbi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Drive the real binary through one live turn
        env:
          KOLK_SMOKE_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "${KOLK_SMOKE_KEY:-}" ]; then
            echo "::notice::no opt-in key is configured; skipping the live smoke test"
            exit 0
          fi
          OPENROUTER_API_KEY="$KOLK_SMOKE_KEY" \
            ./scripts/smoke.sh --real --model meta-llama/llama-3.3-70b-instruct:free
