# GoReleaser stays on the OSS tier, deliberately: monorepo mode, the prebuilt
# importer, .app/.dmg/.msi bundling and native bundle notarization are all Pro.
# This file ships the CLI only. Desktop bundles go through their own workflow on
# native runners, and GoReleaser is never asked to do them.
version: 2

project_name: kolk

before:
  hooks:
    - go mod tidy

builds:
  - id: kolk
    main: ./cmd/kolk
    binary: kolk
    # The cgo rule: every binary this repo ships is cgo-free (§1). The two
    # written-down exceptions both live outside the root module.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/onembyte/kolkrabbi/internal/buildinfo.version={{.Version}}
      - -X github.com/onembyte/kolkrabbi/internal/buildinfo.commit={{.FullCommit}}
      - -X github.com/onembyte/kolkrabbi/internal/buildinfo.date={{.Date}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: kolk
    ids: [kolk]
    name_template: "kolk_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sign the one SHA-256 manifest rather than each archive independently. The
# bundle carries Cosign's keyless certificate and signature together; a user
# can authenticate every archive by verifying this file once, then its digest.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

snapshot:
  # The historical prototype tag is `proto-0`, intentionally not SemVer.
  # Keep untagged release rehearsals on the current public release line.
  version_template: "1.1.0-dev.{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^plan:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
